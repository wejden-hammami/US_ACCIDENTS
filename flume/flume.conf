agent.sources = r1
agent.channels = c1
agent.sinks = k1

agent.sources.r1.type = TAILDIR
agent.sources.r1.filegroups = f1
agent.sources.r1.filegroups.f1 = /tmp/logs_accidents/.*\.log
agent.sources.r1.positionFile = /tmp/flume_taildir_position.json
agent.sources.r1.channels = c1

agent.channels.c1.type = memory
agent.channels.c1.capacity = 10000
agent.channels.c1.transactionCapacity = 1000

agent.sinks.k1.type = logger
agent.sinks.k1.maxBytesToLog = 300
agent.sinks.k1.channel = c1
