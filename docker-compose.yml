services:
  namenode:
    image: apache/hadoop:3
    hostname: namenode
    container_name: namenode
    user: root
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    ports:
      - "9870:9870"
      - "8020:8020"
    environment:
      HADOOP_HOME: /opt/hadoop
      CORE-SITE.XML_fs.default.name: hdfs://namenode:8020
      CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020
      HDFS-SITE.XML_dfs.namenode.rpc-address: namenode:8020
      HDFS-SITE.XML_dfs.replication: "1"
      HDFS-SITE.XML_dfs.namenode.name.dir: /tmp/hadoop-hadoop/dfs/name
      HDFS-SITE.XML_dfs.datanode.data.dir: /tmp/hadoop-hadoop/dfs/data
      MAPRED-SITE.XML_mapreduce.framework.name: yarn
      MAPRED-SITE.XML_mapreduce.application.classpath: $HADOOP_HOME/share/hadoop/mapreduce/*:$HADOOP_HOME/share/hadoop/mapreduce/lib/*
      YARN-SITE.XML_yarn.resourcemanager.hostname: resourcemanager
      YARN-SITE.XML_yarn.nodemanager.vmem-check-enabled: "false"
      YARN-SITE.XML_yarn.nodemanager.aux-services: mapreduce_shuffle
      YARN-SITE.XML_yarn.nodemanager.aux-services.mapreduce.shuffle.class: org.apache.hadoop.mapred.ShuffleHandler
    volumes:
      - namenode_data:/tmp/hadoop-hadoop/dfs/name
      - ./namenode-entrypoint.sh:/entrypoint.sh
    networks:
      - bigdata

  datanode:
    image: apache/hadoop:3
    container_name: datanode
    user: root
    command: >
      bash -c "mkdir -p /tmp/hadoop-hadoop/dfs/data &&
               chown -R hadoop:hadoop /tmp/hadoop-hadoop &&
               su -s /bin/bash hadoop -c 'hdfs datanode'"
    env_file:
      - ./config/hadoop.env
    volumes:
      - datanode_data:/tmp/hadoop-hadoop/dfs/data
    depends_on:
      - namenode
    networks:
      - bigdata

  resourcemanager:
    image: apache/hadoop:3
    hostname: resourcemanager
    container_name: resourcemanager
    command: ["yarn", "resourcemanager"]
    ports:
      - "8088:8088"
    env_file:
      - ./config/hadoop.env
    depends_on:
      - namenode
    networks:
      - bigdata

  nodemanager:
    image: apache/hadoop:3
    container_name: nodemanager
    command: ["yarn", "nodemanager"]
    env_file:
      - ./config/hadoop.env
    depends_on:
      - resourcemanager
    networks:
      - bigdata

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bigdata

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    networks:
      - bigdata

  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: accidents_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sqoop:/docker-entrypoint-initdb.d
    networks:
      - bigdata

  sqoop:
    build: ./sqoop
    container_name: sqoop
    entrypoint: ["tail", "-f", "/dev/null"]
    depends_on:
      - namenode
      - mysql
    environment:
      - HDFS_CONF_fs_defaultFS=hdfs://namenode:8020
      - YARN_CONF_yarn_resourcemanager_address=resourcemanager:8032
      - YARN_CONF_yarn_resourcemanager_resource__tracker_address=resourcemanager:8031
      - YARN_CONF_yarn_resourcemanager_scheduler_address=resourcemanager:8030
      - MAPRED_CONF_mapreduce_framework_name=yarn

    

    networks:
      - bigdata

  hive-metastore:
    image: apache/hive:3.1.3
    container_name: hive-metastore
    hostname: hive-metastore
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: derby
    ports:
      - "9083:9083"
    depends_on:
      - namenode
    networks:
      - bigdata

  hiveserver2:
    image: apache/hive:3.1.3
    container_name: hiveserver2
    hostname: hiveserver2
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
    ports:
      - "10000:10000"
      - "10002:10002"
    depends_on:
      - hive-metastore
    networks:
      - bigdata

  flume:
    build: ./flume
    container_name: flume
    volumes:
      - ./flume/flume.conf:/opt/flume/conf/flume.conf
      - ./flume/logs:/tmp/logs_accidents
    command: >
      flume-ng agent --conf /opt/flume/conf
      --conf-file /opt/flume/conf/flume.conf
      --name agent -Dflume.root.logger=INFO,console
    depends_on:
      - namenode
    networks:
      - bigdata

volumes:
  namenode_data:
  datanode_data:
  mysql_data:

networks:
  bigdata:
    driver: bridge
